<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login · Askbook</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/auth.css" />
</head>
<body>
  <div class="auth-page admin">
    <div class="auth-card">
      <a class="auth-back" id="backLink" href="#">← Back</a>
      <div class="auth-icon" id="roleIcon"></div>
      <h1>Admin Login</h1>
      <p class="auth-sub">Sign in to manage faculty, students, courses and settings.</p>

      <div class="form-error" id="formError" hidden></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <div class="input-wrap" id="mailIconWrap">
            <input type="email" id="email" name="email" placeholder="admin@miet.edu" autocomplete="username" />
          </div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap" id="lockIconWrap">
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" />
            <button type="button" class="toggle-visibility" id="toggleVisibility"></button>
          </div>
        </div>
        <button type="submit" class="btn-primary" id="submitBtn">Sign in</button>
      </form>

      <div class="auth-divider">or</div>
      <button type="button" class="btn-google" id="googleBtn" data-label="Continue with Google">
        <span id="googleIconSlot"></span><span class="btn-label">Continue with Google</span>
      </button>

      <p class="auth-switch">Don't have an account? <a id="signupLink" href="#">Create one</a></p>

      <div class="auth-demo">
        Demo credentials: <code>admin@miet.edu</code> / <code>admin123</code>
      </div>
    </div>
  </div>

  <script type="module">
    import { icon, googleIcon } from '../js/common/icons.js';
    import { initLoginPage, backToHomeLink, signupLink } from '../js/common/loginPage.js';

    document.getElementById('backLink').href = backToHomeLink();
    document.getElementById('signupLink').href = signupLink('admin');
    document.getElementById('roleIcon').innerHTML = icon('settings', { size: 26 });
    document.getElementById('mailIconWrap').insertAdjacentHTML('afterbegin', icon('mail', { size: 16 }));
    document.getElementById('googleIconSlot').innerHTML = googleIcon(18);

    const toggleBtn = document.getElementById('toggleVisibility');
    toggleBtn.insertAdjacentHTML('afterbegin', icon('eye', { size: 16 }));
    document.getElementById('lockIconWrap').insertAdjacentHTML('afterbegin', icon('lock', { size: 16 }));

    let visible = false;
    toggleBtn.addEventListener('click', () => {
      visible = !visible;
      const input = document.getElementById('password');
      input.type = visible ? 'text' : 'password';
      toggleBtn.innerHTML = icon(visible ? 'eyeOff' : 'eye', { size: 16 });
    });

    initLoginPage('admin');
  </script>
</body>
</html>
